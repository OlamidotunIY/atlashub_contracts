syntax = "proto3";

package atlashub.common.v1alpha1;

option java_package = "com.atlashub.contracts.common.v1alpha1";
option java_multiple_files = true;
option java_outer_classname = "PaginationProto";

// Page tokens are opaque, server-issued and cannot confer authorization.
message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}
